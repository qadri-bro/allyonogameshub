services:
  - type: web
    name: allyonogameshub
    runtime: node
    plan: free
    buildCommand: cd yono-platform/backend && npm ci && cd ../website && npm ci && npm run build && cd ../admin && npm ci && npm run build
    startCommand: cd yono-platform/backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
